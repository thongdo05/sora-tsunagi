name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fsSL -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --version

      - name: Export single-threaded Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          python3 - << 'PY'
          html = open("build/web/index.html", encoding="utf-8").read()
          compact = html.replace(" ", "")
          if "constGODOT_THREADS_ENABLED=false" not in compact:
              raise SystemExit("Web export enabled threads. GitHub Pages cannot send COOP/COEP, so SharedArrayBuffer will not work.")
          if "ensureCrossOriginIsolationHeaders\":true" in html.replace(" ", ""):
              raise SystemExit("Export asks for cross-origin isolation headers, which GitHub Pages cannot set.")
          for needle in ("100dvh", "touch-action: none", "viewport-fit=cover"):
              if needle not in html:
                  raise SystemExit("Custom web shell is missing %s" % needle)
          print("single-threaded web shell ok")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
